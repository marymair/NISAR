name: Live NASA ASF catalog smoke test
on:
  push:
    paths:
      - backend/main.py
      - .github/workflows/live-catalog-smoke.yml
  workflow_dispatch:
jobs:
  nasa-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Verify public NASA ASF queries without Earthdata login
        run: |
          python - <<'PY'
          from datetime import date
          from backend.main import _catalog
          examples = [
              (10.55, -66.9, date(2026, 6, 17), date(2026, 7, 5), "ground"),
              (-24.5, 33.2, date(2025, 12, 25), date(2026, 2, 1), "flood"),
          ]
          for lat, lon, a, b, kind in examples:
              items = _catalog(lat, lon, a, b, kind)
              print(kind, a, b, "found", len(items), "science granules")
              if items:
                  print("sample property keys:", sorted(items[0]["properties"].keys()))
                  print("sample acquisition fields:", {
                      k: items[0]["properties"].get(k)
                      for k in ("startTime", "pathNumber", "frameNumber", "flightDirection", "processingLevel", "dataMaturity")
                  })
                  if kind == "flood":
                      from backend.main import _choose_gc_pair
                      pair = _choose_gc_pair(items)
                      print("compatible GCOV pair:", bool(pair))
                  print("first file:", items[0]["properties"].get("fileID"))
                  print("maturity:", items[0]["properties"].get("dataMaturity"))
                  print("data URL present:", bool(items[0].get("url")))
          PY
