name: Verify ZORI Observatory
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Python syntax
        run: python -m compileall -q backend
      - name: Offline scientific and API tests
        run: python -m pytest -q tests
      - name: JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/zori.js
          node --check frontend/config.js
          node --check frontend/science-i18n.js
          node --check frontend/i18n.js
          node --check frontend/i18n-extra.js
          node --check frontend/samples.js
